# =============================================================================
# QIDI PLUS 5 - RGB EFFECTS MOD
# Repository: https://github.com/tonngodoc/qidi-plus5-rgb
# =============================================================================

[gcode_macro CANHSATHINHSU]
description: Police Strobe: Double flash Left Blue -> Right Red x 10 cycles
gcode:
    NEOPIXEL_CANHSATHINHSU

[gcode_macro DISCODANCE]
description: Disco Dance: Double flash Underbed Blue/Red + Chamber Light x 10 cycles
gcode:
    NEOPIXEL_DISCODANCE

[gcode_macro XANHDO]
description: Alias for CANHSATHINHSU
gcode:
    CANHSATHINHSU

[gcode_macro RGB_RAINBOW]
description: Enable smooth 7-color rainbow wave (Screen-sleep bypass)
gcode:
    NEOPIXEL_ENABLE ENABLE=1
    NEOPIXEL_MODE M=4 COUNT=25 PERIOD=5000 TICK=30
    {action_respond_info("🌈 Rainbow wave enabled")}

[gcode_macro RGB_AUTO]
description: Restore default printer auto LED status
gcode:
    NEOPIXEL_ENABLE ENABLE=1
    {action_respond_info("⚡ Auto LED mode restored")}

[gcode_macro RGB_OFF]
description: Turn off underbed RGB strip
gcode:
    NEOPIXEL_ENABLE ENABLE=0
    NEOPIXEL_MODE M=0 COUNT=0
    {action_respond_info("🛑 RGB LED turned OFF")}
